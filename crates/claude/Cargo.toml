[package]
name = "afterchat-claude"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "claude"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chatformat = { package = "afterchat-chatformat", path = "../chatformat" }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
