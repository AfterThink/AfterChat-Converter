[package]
name = "afterchat-qwen"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "qwen"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chatformat = { package = "afterchat-chatformat", path = "../afterchat-chatformat" }
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
