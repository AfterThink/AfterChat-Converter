[package]
name = "afterchat-rikka"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rikka"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chatformat = { package = "afterchat-chatformat", path = "../afterchat-chatformat" }
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
