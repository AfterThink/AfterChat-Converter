name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 国内本地开发用 gui/.npmrc 里的镜像源；CI 上统一走官方源
  BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  release:
    name: Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本号的唯一来源是 gui/src-tauri/tauri.conf.json。
      # 改动它并 push 到 master，就会自动打 tag 并发布；tag 已存在则跳过。
      - name: Detect version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content gui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).package.version
          $tag = "v$version"
          git fetch --tags --force
          $exists = [bool](git tag --list $tag)
          if ($exists) { $should = "false" } else { $should = "true" }
          Write-Host "version = $version"
          Write-Host "tag     = $tag"
          Write-Host "release = $should"
          "version=$version"       >> $env:GITHUB_OUTPUT
          "tag=$tag"               >> $env:GITHUB_OUTPUT
          "should_release=$should" >> $env:GITHUB_OUTPUT

      - name: Nothing to release
        if: steps.version.outputs.should_release != 'true'
        run: echo "tag ${{ steps.version.outputs.tag }} already exists - skip release."

      - name: Setup Bun
        if: steps.version.outputs.should_release == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        if: steps.version.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        if: steps.version.outputs.should_release == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install GUI dependencies
        if: steps.version.outputs.should_release == 'true'
        working-directory: gui
        run: bun install --frozen-lockfile

      # beforeBuildCommand 会先跑 prepare:sidecars:release，把 5 个转换器编到 target/release/
      - name: Build (Tauri + sidecars)
        if: steps.version.outputs.should_release == 'true'
        working-directory: gui
        run: bun x tauri build --bundles nsis --ci -v

      - name: Package artifacts
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $version  = "${{ steps.version.outputs.version }}"
          $cliName  = "afterchat-converters-$version-windows-x64"

          New-Item -ItemType Directory -Force dist | Out-Null

          # 1) GUI installer (NSIS)
          Copy-Item target/release/bundle/nsis/*.exe dist/

          # 2) the five CLI converters -> one zip
          $cliDir = "dist/$cliName"
          New-Item -ItemType Directory -Force $cliDir | Out-Null
          foreach ($bin in @("ai-studio", "cherry", "qwen", "claude", "rikka")) {
            Copy-Item "target/release/$bin.exe" $cliDir/
          }
          Compress-Archive -Path "$cliDir/*" -DestinationPath "dist/$cliName.zip" -Force
          Remove-Item -Recurse -Force $cliDir

          Get-ChildItem dist | Select-Object Name, @{n = 'Size'; e = { "{0:N0} KB" -f ($_.Length / 1KB) } } | Format-Table

      - name: Create release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
