name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  detect-version:
    name: Detect Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version and tag
        id: version
        shell: bash
        run: |
          VERSION=$(grep '"version"' gui/package.json | head -1 | awk -F '"' '{print $4}')
          TAG="v$VERSION"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - skip release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New release: $TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.platform }})
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-latest
          - platform: macos-x64
            os: macos-13
          - platform: linux-x64
            os: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install GUI dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: gui
        run: bun x tauri build --bundles nsis --ci -v

      - name: Build macOS
        if: runner.os == 'macOS'
        working-directory: gui
        run: bun x tauri build --bundles dmg --ci -v

      - name: Build Linux
        if: runner.os == 'Linux'
        working-directory: gui
        run: bun x tauri build --bundles appimage,deb --ci -v

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.detect-version.outputs.version }}"
          $zipName = "afterchat-converter-$version-windows-x64"
          New-Item -ItemType Directory -Force dist | Out-Null

          # Installer
          Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName dist/
          }

          # Portable bundle
          $portable = "dist/$zipName"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item target/release/afterchat-converter.exe $portable/
          foreach ($bin in @("ai-studio", "cherry", "qwen", "claude", "rikka", "chatgpt")) {
            Copy-Item "target/release/$bin.exe" $portable/
          }
          Compress-Archive -Path "$portable/*" -DestinationPath "dist/$zipName.zip" -Force
          Remove-Item -Recurse -Force $portable

      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          ARCH_NAME="${{ matrix.platform }}"
          BUNDLE_NAME="afterchat-converter-${VERSION}-${ARCH_NAME}"
          mkdir -p dist

          # DMG installer
          find target/release/bundle/dmg -name "*.dmg" -exec cp {} dist/ \;

          # Portable tar.gz
          PORTABLE_DIR="dist/${BUNDLE_NAME}"
          mkdir -p "$PORTABLE_DIR"
          if [ -d "target/release/bundle/macos/afterchat-converter.app" ]; then
            cp -R target/release/bundle/macos/afterchat-converter.app "$PORTABLE_DIR/"
          else
            cp target/release/afterchat-converter "$PORTABLE_DIR/"
          fi
          for bin in ai-studio cherry qwen claude rikka chatgpt; do
            cp "target/release/$bin" "$PORTABLE_DIR/"
          done
          tar -czf "dist/${BUNDLE_NAME}.tar.gz" -C dist "${BUNDLE_NAME}"
          rm -rf "$PORTABLE_DIR"

      - name: Package artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          BUNDLE_NAME="afterchat-converter-${VERSION}-linux-x64"
          mkdir -p dist

          # AppImage and Deb
          find target/release/bundle/appimage -name "*.AppImage" -exec cp {} dist/ \; 2>/dev/null || true
          find target/release/bundle/deb -name "*.deb" -exec cp {} dist/ \; 2>/dev/null || true

          # Portable tar.gz
          PORTABLE_DIR="dist/${BUNDLE_NAME}"
          mkdir -p "$PORTABLE_DIR"
          cp target/release/afterchat-converter "$PORTABLE_DIR/"
          for bin in ai-studio cherry qwen claude rikka chatgpt; do
            cp "target/release/$bin" "$PORTABLE_DIR/"
          done
          tar -czf "dist/${BUNDLE_NAME}.tar.gz" -C dist "${BUNDLE_NAME}"
          rm -rf "$PORTABLE_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [detect-version, build]
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: ${{ needs.detect-version.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
