name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  detect-version:
    name: Detect Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version and tag
        id: version
        shell: bash
        run: |
          VERSION=$(grep '"version"' gui/package.json | head -1 | awk -F '"' '{print $4}')
          TAG="v$VERSION"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - skip release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New release: $TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build:
    name: Build (windows-x64)
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install GUI dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      - name: Build Windows
        working-directory: gui
        run: bun x tauri build --bundles nsis --ci -v

      - name: Package artifacts (Windows)
        shell: pwsh
        run: |
          $version = "${{ needs.detect-version.outputs.version }}"
          $zipName = "afterchat-converter-$version-windows-x64"
          New-Item -ItemType Directory -Force dist | Out-Null

          # Installer
          Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName dist/
          }

          # Portable bundle
          $portable = "dist/$zipName"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item target/release/afterchat-converter.exe $portable/
          foreach ($bin in @("ai-studio", "cherry", "qwen", "claude", "rikka", "chatgpt")) {
            Copy-Item "target/release/$bin.exe" $portable/
          }
          Compress-Archive -Path "$portable/*" -DestinationPath "dist/$zipName.zip" -Force
          Remove-Item -Recurse -Force $portable

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows-x64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [detect-version, build]
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect-version.outputs.tag }}
          name: ${{ needs.detect-version.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
