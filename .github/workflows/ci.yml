name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Check GUI version consistency
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          $pkg   = (Get-Content gui/package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content gui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).package.version
          $crate = (Get-Content gui/src-tauri/Cargo.toml |
                    Select-String -Pattern '^version\s*=\s*"([^"]+)"' |
                    Select-Object -First 1).Matches.Groups[1].Value
          Write-Host "package.json=$pkg  tauri.conf.json=$tauri  Cargo.toml=$crate"
          if ($pkg -ne $tauri -or $pkg -ne $crate) {
            throw "GUI version mismatch: package.json=$pkg, tauri.conf.json=$tauri, Cargo.toml=$crate"
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check GUI lockfile
        if: matrix.os == 'ubuntu-latest'
        working-directory: gui
        run: bun install --frozen-lockfile

      - name: Test crates
        run: cargo test --workspace --exclude afterchat-converter
