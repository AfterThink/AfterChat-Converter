[package]
name = "google-ai-studio-json-converter"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "ai-studio"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11.8"
anyhow = "1.0"
regex = "1.10"
walkdir = "2.5.0"
rayon = "1.10.0"
filetime = "0.2.25"
