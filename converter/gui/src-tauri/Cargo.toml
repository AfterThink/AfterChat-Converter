[package]
name = "afterchat-converter"
version = "0.1.0"
description = "Tauri GUI for local conversation converters"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.6", features = ["dialog-all", "path-all", "process-command-api", "window-close", "window-start-dragging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
