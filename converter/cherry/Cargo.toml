[package]
name = "cherry-studio-backup-json-converter"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "cherry"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
regex = "1.10"
chrono = "0.4"
anyhow = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
